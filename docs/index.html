<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Escape Cup</title>
<style>
  :root {
    --bg: #0b1024;
    --panel: rgba(14, 20, 46, 0.92);
    --ink: #ffffff;
    --muted: #9fb0e0;
    --gold: #ffcf3f;
    --go: #3f8cff;
    --ad: #b062ff;
    --danger: #ff4d6d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .layer { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }
  button { pointer-events: auto; font: inherit; color: var(--ink); border: 0; cursor: pointer; border-radius: 16px;
    font-weight: 800; letter-spacing: .02em; transition: transform .08s; }
  button:active { transform: scale(.94); }

  /* HUD */
  #hud { justify-content: flex-start; padding: max(10px, env(safe-area-inset-top)) 12px 0; }
  .topbar { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 15px;
    display: flex; align-items: center; gap: 6px; }
  .coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffcf3f 45%, #d99a00);
    box-shadow: 0 0 0 2px rgba(0,0,0,.15) inset; }
  .iconbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.08); font-size: 18px; }
  #round { font-size: 13px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
  .scoreline { margin-top: 8px; display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 26px; }
  .scoreline img { width: 30px; height: 20px; border-radius: 4px; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .scoreline .you { font-size: 11px; color: var(--gold); letter-spacing: .1em; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ringbar { margin-top: 8px; width: min(70vw, 300px); height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
  .ringbar > div { height: 100%; width: 0; background: linear-gradient(90deg, #3f8cff, #b062ff, #ff5fa2); transition: width .2s; }
  #banner { position: fixed; top: 34%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 900;
    letter-spacing: .04em; text-shadow: 0 4px 24px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .2s; }

  /* Title / attract */
  #title { justify-content: flex-end; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
  #title h1 { margin: 0; font-size: clamp(42px, 11vw, 72px); font-weight: 900; letter-spacing: .02em; line-height: .95; text-align: center;
    background: linear-gradient(180deg, #fff 30%, #ffd54a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,.5)); }
  #title .sub { color: var(--muted); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; margin: 8px 0 18px; }
  #title .row { display: flex; gap: 10px; }
  .btn { padding: 14px 22px; font-size: 18px; background: var(--go); box-shadow: 0 6px 0 #2459b8; }
  .btn.gold { background: var(--gold); color: #3a2a00; box-shadow: 0 6px 0 #b88a00; }
  .btn.ghost { background: rgba(255,255,255,.1); box-shadow: none; }
  .btn.ad { background: var(--ad); box-shadow: 0 6px 0 #7a35c0; display: flex; align-items: center; gap: 8px; }
  .vid { width: 22px; height: 16px; border-radius: 4px; background: #fff; position: relative; flex: none; }
  .vid::after { content: ""; position: absolute; left: 8px; top: 4px; border-left: 8px solid var(--ad); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }

  /* Hand hint */
  #hint { position: fixed; left: 50%; bottom: 30%; width: 64px; height: 64px; margin-left: -32px; pointer-events: none; }
  #hint .hand { width: 64px; height: 64px; animation: swipe 1.6s ease-in-out infinite; }
  #hint.tap .hand { animation: tap 1s ease-in-out infinite; }
  @keyframes swipe { 0% { transform: translateX(-70px); opacity: 0 } 15% { opacity: 1 } 50% { transform: translateX(70px) } 85% { opacity: 1 } 100% { transform: translateX(-70px); opacity: 0 } }
  @keyframes tap { 0%, 100% { transform: scale(1) } 40% { transform: scale(.82) } }

  /* Panels */
  .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: auto;
    background: rgba(5, 8, 20, .55); }
  .card { width: 100%; max-width: 420px; background: var(--panel); border-radius: 24px; padding: 22px 18px 20px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08); }
  .card h2 { margin: 0 0 4px; font-size: 38px; font-weight: 900; }
  .card .muted { color: var(--muted); font-weight: 700; }
  .card .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .earn { margin: 12px auto 0; display: inline-flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 900; color: var(--gold); }
  .bracket { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .bracket .step { width: 54px; padding: 6px 0 5px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 900; color: var(--muted); }
  .bracket .step img { display: block; width: 30px; height: 20px; margin: 4px auto 0; border-radius: 3px; }
  .bracket .step.done { background: rgba(63,140,255,.25); color: #fff; }
  .bracket .step.now { background: var(--gold); color: #3a2a00; }
  .trophy { font-size: 64px; line-height: 1; }

  /* Shop */
  .tabs { display: flex; gap: 8px; justify-content: center; margin: 10px 0 12px; }
  .tabs button { padding: 8px 14px; background: rgba(255,255,255,.08); font-size: 14px; }
  .tabs button.on { background: var(--go); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 46vh; overflow-y: auto; padding: 2px; touch-action: pan-y; }
  .cell { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 2px 6px; font-size: 11px; font-weight: 800; color: var(--muted); pointer-events: auto; }
  .cell img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 4px; }
  .cell.locked img { filter: grayscale(1) brightness(.5); }
  .cell.sel { outline: 3px solid var(--gold); color: #fff; }
  .upg { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,.06);
    border-radius: 14px; padding: 12px; margin-bottom: 8px; text-align: left; }
  .upg b { display: block; font-size: 16px; }
  .upg small { color: var(--muted); font-weight: 700; }
  .pips { display: flex; gap: 3px; margin-top: 5px; }
  .pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); }
  .pips i.on { background: var(--gold); }
  .upg button { padding: 10px 12px; background: var(--gold); color: #3a2a00; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .upg button:disabled { background: rgba(255,255,255,.12); color: var(--muted); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="layer hidden">
  <div class="topbar">
    <button class="iconbtn" id="muteBtn" aria-label="Sound">🔊</button>
    <div id="round">Round of 32</div>
    <div class="chip"><span class="coin"></span><span class="coins">0</span></div>
  </div>
  <div class="scoreline">
    <div class="side"><img id="hudFlagA" alt=""><span class="you">YOU</span></div>
    <span id="scoreA">0</span><span style="opacity:.4">–</span><span id="scoreB">0</span>
    <div class="side"><img id="hudFlagB" alt=""><span class="you" id="rivalName" style="color:var(--muted)"></span></div>
  </div>
  <div class="ringbar"><div id="ringFill"></div></div>
</div>

<div id="banner"></div>

<div id="title" class="layer">
  <h1>ESCAPE<br>CUP</h1>
  <div class="sub" id="titleSub">Cup 1 · Round of 32</div>
  <div class="row">
    <button class="btn ghost" id="titleShop">Shop</button>
  </div>
</div>

<div id="hint" class="hidden">
  <svg class="hand" viewBox="0 0 64 64"><g fill="#fff" stroke="#0b1024" stroke-width="2.5" stroke-linejoin="round">
    <path d="M26 30V12a4 4 0 0 1 8 0v16l2-1a4 4 0 0 1 5 3l1 1a4 4 0 0 1 6 2l1 1a4 4 0 0 1 6 3v9c0 8-6 14-14 14h-4c-5 0-9-2-12-6l-9-12a4 4 0 0 1 6-5z"/></g></svg>
</div>

<div id="result" class="modal hidden"><div class="card" id="resultCard"></div></div>
<div id="shop" class="modal hidden"><div class="card" id="shopCard"></div></div>

<script>
  // Poki SDK shim: lets the game run locally / offline; the real SDK replaces it on Poki.
  window.__pokiShim = {
    init: () => Promise.resolve(), gameLoadingFinished() {}, gameplayStart() {}, gameplayStop() {},
    commercialBreak: (before) => Promise.resolve(), rewardedBreak: (before) => { before && before(); return new Promise(r => setTimeout(() => r(true), 400)); },
    setDebug() {}, openExternalLink(u) { window.open(u, "_blank"); }
  };
</script>
<script>
  // Real Poki SDK only on Poki (or with ?poki in the URL); everywhere else (local dev,
  // the GitHub Pages preview) the shim runs so there are no ad calls or waits.
  (function () {
    const h = location.hostname;
    const offPoki = h === "localhost" || h === "127.0.0.1" || h.endsWith("github.io") || location.protocol === "file:";
    const load = (src) => document.write('<script src="' + src + '"><\/script>');
    if (offPoki && !/[?&]poki\b/.test(location.search)) window.PokiSDK = window.__pokiShim;
    else load("https://game-cdn.poki.com/scripts/v2/poki-sdk.js");
  })();
</script>
<script>if (!window.PokiSDK) window.PokiSDK = window.__pokiShim;</script>
<script src="flags.js"></script>
<script src="game.js"></script>
</body>
</html>
